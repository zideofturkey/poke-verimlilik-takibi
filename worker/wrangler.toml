name = "poke-telegram-webhook"
main = "index.js"
compatibility_date = "2025-01-01"

# YEDEK tetikleyici (bkz. index.js'teki scheduled() dokümantasyonu) -
# GitHub Actions'ın kendi schedule tetiklemesi Ağustos 2026'da ciddi
# şekilde kaymaya/gecikmeye başladığı için (platform kaynaklı, koddan
# düzeltilemeyen bir sorun), Cloudflare Workers'ın KENDİ Cron Triggers
# altyapısı (GitHub'dan tamamen bağımsız) burada yedek olarak devreye
# giriyor. Saatler gonder.yml'deki `schedule:` ile BİREBİR AYNI (UTC) -
# ikisi de aynı anda tetiklenebilir, sabah()/hatirlat()/aksam()'daki
# "zaten cevaplanmış mı" kontrolleri çakışmayı zaten engelliyor.
#
# KRİTİK KISIT: Cloudflare Workers'ın FREE PLAN'ı worker başına EN FAZLA
# 3 Cron Trigger'a izin veriyor - ilk denemede buraya 6 ayrı cron satırı
# konmuştu, bu yüzden `wrangler deploy` "Some triggers failed to deploy"
# / Cloudflare API'den 400 Bad Request hatası aldı (limit aşıldığı için
# TÜM istek reddedildi, kısmi kabul yok). Çözüm: TEK bir saatlik tetikleyici
# (`0 * * * *`) tanımlanıyor, hangi görevin (sabah/hatirlat/aksam/vb.)
# çalışacağına worker'ın KENDİSİ (index.js'teki scheduled()) o anki UTC
# saatine bakarak karar veriyor - 6 ayrı cron yerine dallanma mantığı,
# limitin çok altında (1/3) kalıyor.
[triggers]
crons = ["0 * * * *"]
