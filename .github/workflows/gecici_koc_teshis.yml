name: GEÇİCİ - Koç Kararı Teşhis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install requests gspread google-auth python-dotenv
      - name: Service account dosyasını oluştur
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$SERVICE_ACCOUNT_JSON" > service_account.json
      - name: Teşhis script'ini çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python temp_koc_teshis.py
      - name: service_account.json'ı sil
        if: always()
        run: rm -f service_account.json
      - name: Sonucu commit'le
        run: |
          git config user.name "poke-bot"
          git config user.email "poke-bot@users.noreply.github.com"
          git add gecici_koc_teshis.txt
          git commit -m "test: koç karar teşhisi [skip ci]" -q || echo "Değişiklik yok"
          git push -q || echo "Push başarısız"
