name: Gönder - Proaktif Mesajlar

# ÖNEMLİ: `schedule:` tetikleyicisi BİLİNÇLİ olarak burada YOK. Ağustos
# 2026'da GitHub Actions'ın kendi scheduled workflow tetiklemesi ciddi
# şekilde kaymaya/gecikmeye başladı (bazı günler +12 saat gecikme,
# gecikmiş çalıştırma hangi cron satırına ait olduğunu bile YANLIŞ
# raporladı) - platform kaynaklı, koddan düzeltilemeyen bir sorun.
# Cloudflare Worker'ın KENDİ Cron Triggers altyapısı (bkz. worker/index.js
# + worker/wrangler.toml) artık TEK zamanlanmış tetikleyici - saat başı
# kontrol edip doğru anda bu workflow'u `workflow_dispatch` API'siyle
# tetikliyor. Bir süre GitHub'ın kendi cron'u ile Cloudflare PARALEL
# çalıştırıldı (bilinçli bir yedeklilik denemesi) - bu süreçte
# `sabah()`/`_bosa_vakit_sor()` gibi proaktif mesaj fonksiyonlarının aynı
# gün için ÇİFT tetiklenmeye karşı korumasız olduğu ortaya çıktı ve
# düzeltildi (bkz. README). Cloudflare'in güvenilirliği (tam saatinde,
# tutarlı tetiklenme) doğrulandıktan sonra GitHub'ın kendi cron'u
# KALDIRILDI - hem gereksiz Actions dakikası tüketimini hem log
# karmaşasını azaltmak için. workflow_dispatch hâlâ burada - hem manuel
# test için hem Cloudflare'in asıl tetikleme yolu olarak.

on:
  workflow_dispatch:       # Manuel tetikleme (test) VE Cloudflare Worker'ın asıl tetikleme yolu
    inputs:
      gorev:
        description: "Hangi görev gönderilsin?"
        required: true
        type: choice
        options:
          - sabah
          - hatirlat
          - aksam
          - hafta_ortasi
          - pazar

jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests gspread google-auth python-dotenv

      - name: Service account dosyasını oluştur
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Görevi belirle ve gönder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          GOREV="${{ inputs.gorev }}"
          python gonder.py "$GOREV"

      - name: service_account.json'ı sil (güvenlik)
        if: always()
        run: rm -f service_account.json
